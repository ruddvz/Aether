<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0a0908">
  <title>Page not found | AETHERIA</title>
  <style>
    :root{--ink:#f4efe7;--dark:#0a0908;--gold:#bb9565;--muted:#9b9389}
    *{box-sizing:border-box}
    html,body{min-height:100%;margin:0;background:var(--dark);color:var(--ink)}
    body{display:grid;place-items:center;padding:32px;font-family:"DM Sans",Arial,sans-serif;text-align:center}
    main{max-width:680px}
    .eyebrow{margin:0 0 20px;color:var(--gold);font-size:11px;letter-spacing:.24em;text-transform:uppercase}
    h1{margin:0;font:400 clamp(56px,10vw,108px)/.92 Georgia,serif;letter-spacing:-.03em}
    p{margin:26px auto 0;max-width:480px;color:var(--muted);font-size:15px;line-height:1.75}
    a{display:inline-flex;align-items:center;justify-content:center;min-height:48px;margin-top:34px;padding:0 24px;border:1px solid rgba(244,239,231,.45);color:var(--ink);font-size:11px;letter-spacing:.15em;text-decoration:none;text-transform:uppercase}
    a:focus-visible{outline:2px solid var(--gold);outline-offset:4px}
    a:hover{background:var(--ink);color:var(--dark)}
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">404</p>
    <h1>Page not found.</h1>
    <p>The page may have moved or the address may be incorrect.</p>
    <a id="home-link" href="/">Return to AETHERIA</a>
  </main>
  <script>
    (() => {
      const link = document.getElementById('home-link');
      if (!link || !location.hostname.endsWith('.github.io')) return;
      const firstSegment = location.pathname.split('/').filter(Boolean)[0];
      link.href = firstSegment ? `/${firstSegment}/` : '/';
    })();
  </script>
</body>
</html>
