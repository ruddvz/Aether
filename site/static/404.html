<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0a0908">
  <meta name="robots" content="noindex">
  <title>Page not found | AETHERIA</title>
  <style>
    :root{--paper:#f0ede6;--gold:#bb9565;--dark:#0a0908;--muted:#8b857c}
    *{box-sizing:border-box}
    html,body{min-height:100%;margin:0}
    body{min-height:100svh;display:grid;place-items:center;padding:32px;background:var(--dark);color:var(--paper);font-family:"DM Sans",Arial,sans-serif;-webkit-font-smoothing:antialiased}
    main{width:min(680px,100%);text-align:center}
    .wordmark{margin:0 0 56px;font-family:Italiana,Georgia,serif;font-size:clamp(28px,5vw,44px);font-weight:400;letter-spacing:.24em}
    .code{margin:0 0 18px;color:var(--gold);font-size:10px;letter-spacing:.24em;text-transform:uppercase}
    h1{margin:0;font-family:Italiana,Georgia,serif;font-size:clamp(54px,10vw,104px);font-weight:400;line-height:.92}
    p{margin:26px auto 0;max-width:460px;color:#aaa298;font-size:15px;line-height:1.8}
    a{display:inline-flex;align-items:center;justify-content:center;min-height:48px;margin-top:38px;padding:0 24px;border:1px solid rgba(240,237,230,.45);color:var(--paper);font-size:11px;letter-spacing:.16em;text-decoration:none;text-transform:uppercase;transition:.2s}
    a:hover,a:focus-visible{background:var(--paper);color:#151311;outline:none}
  </style>
</head>
<body>
  <main>
    <div class="wordmark">AETHERIA</div>
    <div class="code">404 / Not found</div>
    <h1>This page has moved.</h1>
    <p>The address does not point to a current AETHERIA page. Return to the main collection and continue from there.</p>
    <a id="home-link" href="/">Return to AETHERIA</a>
  </main>
  <script>
    (() => {
      const link = document.getElementById('home-link');
      if (location.hostname.endsWith('.github.io')) {
        const first = location.pathname.split('/').filter(Boolean)[0];
        if (first) link.href = `/${first}/`;
      }
    })();
  </script>
</body>
</html>
