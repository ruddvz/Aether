<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0a0908">
  <meta name="robots" content="noindex">
  <title>Page not found | AETHERIA</title>
  <link rel="icon" href="https://ruddvz.github.io/Aether/favicon.svg" type="image/svg+xml">
  <style>
    :root{--dark:#0a0908;--paper:#f0ede6;--gold:#bb9565;--muted:#9f978d}
    *{box-sizing:border-box}
    html,body{min-height:100%;margin:0}
    body{min-height:100svh;display:grid;place-items:center;padding:32px;background:var(--dark);color:var(--paper);font-family:Arial,sans-serif;text-align:center}
    main{max-width:620px}
    .mark{margin:0 0 30px;font-family:Georgia,serif;font-size:clamp(28px,6vw,52px);font-weight:400;letter-spacing:.24em}
    .code{margin:0 0 12px;color:var(--gold);font-size:11px;letter-spacing:.22em;text-transform:uppercase}
    h1{margin:0;font-family:Georgia,serif;font-size:clamp(42px,8vw,76px);font-weight:400;line-height:1}
    p{margin:24px auto 0;max-width:440px;color:var(--muted);font-size:15px;line-height:1.7}
    a{display:inline-flex;min-height:48px;align-items:center;justify-content:center;margin-top:34px;padding:0 24px;border:1px solid rgba(240,237,230,.42);color:var(--paper);font-size:11px;letter-spacing:.14em;text-decoration:none;text-transform:uppercase}
    a:focus-visible{outline:2px solid var(--gold);outline-offset:4px}
    a:hover{background:var(--paper);color:var(--dark)}
  </style>
</head>
<body>
  <main>
    <div class="mark">AETHERIA</div>
    <p class="code">404 / Page not found</p>
    <h1>This page has moved<br>or does not exist.</h1>
    <p>Return to the AETHERIA collection and continue from the main site.</p>
    <a href="https://ruddvz.github.io/Aether/">Return to AETHERIA</a>
  </main>
</body>
</html>
