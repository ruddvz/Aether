name: Product design change
description: Propose a visual, geometric, lighting, material, or interaction change.
title: "[Design] "
labels: []
body:
  - type: input
    id: product
    attributes:
      label: Product
      value: "VORTEX / VX4800"
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Current condition
    validations:
      required: true
  - type: textarea
    id: proposed
    attributes:
      label: Proposed change
    validations:
      required: true
  - type: dropdown
    id: controlled
    attributes:
      label: Does this change controlled geometry or product data?
      options:
        - No, presentation only
        - Yes
        - Unsure
    validations:
      required: true
  - type: textarea
    id: success
    attributes:
      label: Acceptance criteria
      description: What must be true for this change to be considered finished?
