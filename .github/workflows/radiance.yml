name: Validate Radiance photometry

on:
  push:
    branches: [main, "feat/**"]
    paths:
      - ".github/workflows/radiance.yml"
      - "fixtures/vx4800/photometry/**"
      - "scripts/validate_radiance_photometry.py"
      - "scripts/validate_vx4800_photometry_system.py"
      - "tools/photometry/**"
      - "schemas/aether-radiance-validation-report.schema.json"
      - "schemas/aether-photometry-system-scene.schema.json"
      - "schemas/aether-photometry-system-report.schema.json"
      - "tests/fixtures/photometry/**"
      - "tests/test_radiance_photometry.py"
      - "tests/test_photometry_system_validation.py"
  pull_request:
    paths:
      - ".github/workflows/radiance.yml"
      - "fixtures/vx4800/photometry/**"
      - "scripts/validate_radiance_photometry.py"
      - "scripts/validate_vx4800_photometry_system.py"
      - "tools/photometry/**"
      - "schemas/aether-radiance-validation-report.schema.json"
      - "schemas/aether-photometry-system-scene.schema.json"
      - "schemas/aether-photometry-system-report.schema.json"
      - "tests/fixtures/photometry/**"
      - "tests/test_radiance_photometry.py"
      - "tests/test_photometry_system_validation.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  radiance-crosscheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install Python validation dependencies
        run: pip install -r requirements-dev.txt
      - name: Download and verify pinned Radiance
        shell: bash
        run: |
          set -euo pipefail
          eval "$(python - <<'PY'
          import json, shlex
          from pathlib import Path
          cfg=json.loads(Path('fixtures/vx4800/photometry/radiance/toolchain-v1.json').read_text())['radiance']
          print('RADIANCE_URL=' + shlex.quote(cfg['linuxAssetUrl']))
          print('RADIANCE_SHA=' + shlex.quote(cfg['linuxAssetSha256']))
          PY
          )"

          ZIP_ROOT="$RUNNER_TEMP/radiance-zip"
          EXTRACT_ROOT="$RUNNER_TEMP/radiance-extracted"
          mkdir -p "$ZIP_ROOT" "$EXTRACT_ROOT"
          curl -L --fail --retry 3 --retry-delay 2 "$RADIANCE_URL" -o "$RUNNER_TEMP/radiance.zip"
          echo "$RADIANCE_SHA  $RUNNER_TEMP/radiance.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/radiance.zip" -d "$ZIP_ROOT"

          RADIANCE_ROOT="$(find "$ZIP_ROOT" -type d -path '*/usr/local/radiance' -print -quit)"
          if [ -z "$RADIANCE_ROOT" ]; then
            TARBALL="$(find "$ZIP_ROOT" -type f \( -name 'radiance-*-Linux.tar.gz' -o -name '*_Linux.tar.gz' \) -print -quit)"
            test -n "$TARBALL"
            tar -xzf "$TARBALL" -C "$EXTRACT_ROOT"
            RADIANCE_ROOT="$(find "$EXTRACT_ROOT" -type d -path '*/usr/local/radiance' -print -quit)"
          fi
          test -n "$RADIANCE_ROOT"

          BIN_DIR="$RADIANCE_ROOT/bin"
          LIB_DIR="$RADIANCE_ROOT/lib"
          test -x "$BIN_DIR/ies2rad"
          test -x "$BIN_DIR/oconv"
          test -x "$BIN_DIR/rtrace"
          test -f "$LIB_DIR/source.cal"
          test -f "$LIB_DIR/lamp.tab"

          echo "$BIN_DIR" >> "$GITHUB_PATH"
          echo "RAYPATH=.:$LIB_DIR" >> "$GITHUB_ENV"
          echo "Radiance root: $RADIANCE_ROOT"
          echo "Radiance bin: $BIN_DIR"
          echo "Radiance lib: $LIB_DIR"
      - name: Verify Radiance executables
        run: |
          command -v ies2rad
          command -v oconv
          command -v rtrace
          rtrace -version
      - name: Run independent synthetic LM-63 cross-check
        run: |
          rm -rf _radiance_validation
          python scripts/validate_radiance_photometry.py \
            tests/fixtures/photometry/synthetic-narrow.ies \
            --out _radiance_validation \
            --provenance synthetic-test \
            --allow-synthetic-test
      - name: Validate per-source report authority boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          report=json.loads(Path('_radiance_validation/radiance-validation.report.json').read_text())
          schema=json.loads(Path('schemas/aether-radiance-validation-report.schema.json').read_text())
          errors=list(Draft202012Validator(schema).iter_errors(report))
          assert not errors, [e.message for e in errors]
          assert report['status'] == 'validation-pass'
          assert report['source']['syntheticTest'] is True
          assert report['source']['provenanceStatus'] == 'synthetic-test'
          assert report['summary']['pipelinePass'] is True
          assert report['summary']['numericalCrossCheckPass'] is True
          assert report['summary']['productPhotometryEligibleForFurtherReview'] is False
          assert report['summary']['productPhotometryApproved'] is False
          print('Radiance synthetic source cross-check passed without promoting product authority.')
          PY
      - name: Run synthetic 14-head direct system aggregation
        run: |
          python scripts/validate_vx4800_photometry_system.py \
            tests/fixtures/photometry/vx4800-system-synthetic.json \
            --output _radiance_validation/system-validation.report.json
      - name: Validate 14-head report authority boundary
        run: |
          python - <<'PY'
          import json
          import math
          from pathlib import Path
          from jsonschema import Draft202012Validator

          report=json.loads(Path('_radiance_validation/system-validation.report.json').read_text())
          schema=json.loads(Path('schemas/aether-photometry-system-report.schema.json').read_text())
          errors=list(Draft202012Validator(schema).iter_errors(report))
          assert not errors, [e.message for e in errors]
          assert report['status'] == 'pipeline-pass'
          assert report['sourceClass'] == 'synthetic-test-only'
          assert report['summary']['pipelinePass'] is True
          assert report['summary']['headCount'] == 14
          assert report['summary']['sensorCount'] == 9
          assert report['summary']['controlledInputsReady'] is False
          assert report['summary']['acceptanceCriteriaReleased'] is False
          assert report['summary']['directDistributionValidated'] is False
          assert report['summary']['occlusionAssessmentCompleted'] is False
          assert report['summary']['reflectanceAssessmentCompletedWhereRequired'] is False
          assert report['summary']['toleranceSensitivityValidated'] is False
          assert report['summary']['full14HeadPhotometricValidationCompleted'] is False
          assert report['summary']['applicationPerformanceValidated'] is False
          assert report['summary']['productPhotometryApproved'] is False
          sensors=report['directLayer']['sensors']
          assert all(math.isfinite(row['totalIlluminanceLux']) and row['totalIlluminanceLux'] >= 0 for row in sensors)
          assert any(row['totalIlluminanceLux'] > 0 for row in sensors)
          assert all(len(row['contributions']) == 14 for row in sensors)
          print('Synthetic 14-head aggregation passed without promoting product authority.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vx4800-radiance-synthetic-crosscheck
          path: _radiance_validation/
          if-no-files-found: warn
