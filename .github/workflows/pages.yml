name: Deploy AETHERIA Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-geometry.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install dependencies
        run: pip install -r requirements-dev.txt -r requirements-geometry.txt
      - name: Validate
        run: python scripts/validate_repository.py
      - name: Geometry QA
        run: python scripts/qa_geometry.py
      - name: Web geometry QA
        run: python scripts/qa_web_geometry.py
      - name: Optimized web geometry QA
        run: python scripts/qa_optimized_web_geometry.py
      - name: Test
        run: pytest -q
      - name: Build site
        run: python scripts/build_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
