name: Validate AETHERIA web quality

on:
  push:
    branches: [main, "feat/**"]
    paths:
      - ".github/workflows/web-quality.yml"
      - "qa/**"
      - "fixtures/platform/web-quality-v1.json"
      - "schemas/aether-web-quality-budget.schema.json"
      - "scripts/qa_site.py"
      - "scripts/build_site.py"
      - "scripts/build_product.py"
      - "scripts/build_viewer.py"
      - "scripts/optimize_web_geometry.py"
      - "scripts/generate_web_geometry.py"
      - "site/**"
      - "fixtures/vx4800/presentation/**"
      - "project.json"
      - "tests/test_web_quality.py"
  pull_request:
    paths:
      - ".github/workflows/web-quality.yml"
      - "qa/**"
      - "fixtures/platform/web-quality-v1.json"
      - "schemas/aether-web-quality-budget.schema.json"
      - "scripts/qa_site.py"
      - "scripts/build_site.py"
      - "scripts/build_product.py"
      - "scripts/build_viewer.py"
      - "scripts/optimize_web_geometry.py"
      - "scripts/generate_web_geometry.py"
      - "site/**"
      - "fixtures/vx4800/presentation/**"
      - "project.json"
      - "tests/test_web_quality.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-geometry.txt

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install product build dependencies
        run: pip install -r requirements-dev.txt -r requirements-geometry.txt

      - name: Run web-quality unit gates
        run: pytest -q tests/test_web_quality.py

      - name: Build Pages tree
        run: python scripts/build_site.py

      - name: Enforce deterministic published-site budgets
        run: |
          mkdir -p qa/artifacts
          python scripts/qa_site.py _site \
            --report qa/artifacts/static-site-qa.report.json

      - name: Install pinned browser QA toolchain
        working-directory: qa
        run: |
          npm install --no-audit --no-fund
          ./node_modules/.bin/playwright install --with-deps chromium firefox webkit
          node -e "const p=require('./node_modules/@playwright/test/package.json'); if(p.version!=='1.62.1') process.exit(2); console.log('Playwright',p.version)"

      - name: Start local Pages server
        run: |
          nohup python -m http.server 4173 --bind 127.0.0.1 --directory _site > qa/artifacts/http-server.log 2>&1 &
          echo $! > qa/artifacts/http-server.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat qa/artifacts/http-server.log
          exit 1

      - name: Run Chromium Firefox WebKit and mobile smoke matrix
        working-directory: qa
        env:
          AETHERIA_QA_BASE_URL: http://127.0.0.1:4173
        run: ./node_modules/.bin/playwright test --config=playwright.config.mjs

      - name: Upload browser QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aetheria-web-quality
          path: qa/artifacts/
          if-no-files-found: warn

  lighthouse-report-production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-geometry.txt

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install product build dependencies
        run: pip install -r requirements-dev.txt -r requirements-geometry.txt

      - name: Build Pages tree for Lighthouse
        run: python scripts/build_site.py

      - name: Install pinned Lighthouse browser toolchain
        working-directory: qa
        run: |
          npm install --no-audit --no-fund
          ./node_modules/.bin/playwright install --with-deps chromium
          node -e "const l=require('./node_modules/lighthouse/package.json'); const c=require('./node_modules/chrome-launcher/package.json'); if(l.version!=='13.4.1'||c.version!=='1.2.1') process.exit(2); console.log('Lighthouse',l.version,'chrome-launcher',c.version)"

      - name: Resolve pinned Chromium executable
        working-directory: qa
        run: |
          CHROME_PATH_VALUE="$(node -e "const {chromium}=require('@playwright/test'); process.stdout.write(chromium.executablePath())")"
          test -x "$CHROME_PATH_VALUE"
          echo "CHROME_PATH=$CHROME_PATH_VALUE" >> "$GITHUB_ENV"

      - name: Start local Pages server for Lighthouse
        run: |
          mkdir -p qa/artifacts/lighthouse
          nohup python -m http.server 4174 --bind 127.0.0.1 --directory _site > qa/artifacts/lighthouse/http-server.log 2>&1 &
          echo $! > qa/artifacts/lighthouse/http-server.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4174/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat qa/artifacts/lighthouse/http-server.log
          exit 1

      - name: Produce Lighthouse mobile and desktop reports
        working-directory: qa
        env:
          AETHERIA_QA_BASE_URL: http://127.0.0.1:4174
        run: node lighthouse-audit.mjs

      - name: Upload Lighthouse evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aetheria-lighthouse-production
          path: qa/artifacts/lighthouse/
          if-no-files-found: warn
