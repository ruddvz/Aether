name: Validate V5.2 presentation reproducibility

on:
  pull_request:
    paths:
      - "requirements-dev.txt"
      - "scripts/generate_vx4800_presentation.py"
      - "fixtures/vx4800/composition/engineering-v1.3.0.csv"
      - "fixtures/vx4800/photometry/concept-v5.2.0.json"
      - "fixtures/vx4800/presentation/v5.2.0/study.json"
      - "fixtures/vx4800/presentation/v5.2.0/released-pose.json"
      - "tests/test_v52_pose_probe.py"
      - ".github/workflows/v52-reproducibility.yml"
  push:
    branches:
      - main
    paths:
      - "requirements-dev.txt"
      - "scripts/generate_vx4800_presentation.py"
      - "fixtures/vx4800/composition/engineering-v1.3.0.csv"
      - "fixtures/vx4800/photometry/concept-v5.2.0.json"
      - "fixtures/vx4800/presentation/v5.2.0/study.json"
      - "fixtures/vx4800/presentation/v5.2.0/released-pose.json"
      - "tests/test_v52_pose_probe.py"
      - ".github/workflows/v52-reproducibility.yml"

permissions:
  contents: read

jobs:
  fingerprint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        numpy-version: ["2.0.2", "2.3.5"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install presentation dependencies
        run: python -m pip install pandas==2.2.3 numpy==${{ matrix.numpy-version }}

      - name: Verify immutable V5.2 fingerprint
        run: |
          python - <<'PY'
          import importlib.util
          import json
          from pathlib import Path

          root = Path('.')
          script = root / 'scripts/generate_vx4800_presentation.py'
          spec = importlib.util.spec_from_file_location('aether_v52_repro', script)
          module = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(module)

          study = json.loads((root / 'fixtures/vx4800/presentation/v5.2.0/study.json').read_text())
          data = module.build()
          assert module.canonical_sha(data) == study['expectedViewerDataSha256']
          print(study['expectedViewerDataSha256'])
          PY
