name: Validate AETHERIA

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-geometry.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install validation dependencies
        run: pip install -r requirements-dev.txt -r requirements-geometry.txt
      - name: Validate canonical product data
        run: python scripts/validate_repository.py
      - name: Blender source QA
        run: python scripts/validate_blender_source.py
      - name: Geometry QA
        run: python scripts/qa_geometry.py
      - name: Web geometry QA
        run: python scripts/qa_web_geometry.py
      - name: Optimized web geometry QA
        run: python scripts/qa_optimized_web_geometry.py
      - name: Run browser tool tests
        run: |
          node --check site/tools/fixture-editor/app.js
          node --check site/tools/fixture-editor/editor-core.mjs
          node --check site/tools/fixture-editor/schema-validator.mjs
          node --test tests/js/*.test.mjs
      - name: Run regression tests
        run: pytest -q
      - name: Build product artifacts
        run: python scripts/build_product.py
      - name: Build Pages tree
        run: python scripts/build_site.py
      - name: Verify public entry points
        run: |
          test -f _site/index.html
          test -f _site/collections.json
          test -f _site/collections/flight/index.html
          test -f _site/collections/ocean/index.html
          test -f _site/collections/botanica/index.html
          test -f _site/collections/celestial/index.html
          test -f _site/collections/abstract-motion/index.html
          test -f _site/products/vx4800/index.html
          test -f _site/products/vx4800/versions/5.2.0/index.html
          test -f _site/products/vx4800/inspect/index.html
          test -f _site/products/vx4800/inspect/inspector.app.js
          test -f _site/tools/fixture-editor/index.html
          test -f _site/tools/fixture-editor/app.js
          test -f _site/tools/fixture-editor/editor-core.mjs
          test -f _site/tools/fixture-editor/schema-validator.mjs
          test -f _site/downloads/vx4800/1.3.0/vx4800-coordination-v1.3.0.glb
          test -f _site/downloads/vx4800/1.3.0/vx4800-coordination-v1.3.0.optimized.glb
          test -f _site/downloads/vx4800/1.3.0/optimization-manifest.json
          python - <<'PY'
          import json
          from pathlib import Path
          collections = json.loads(Path('_site/collections.json').read_text())
          by_id = {item['id']: item for item in collections}
          expected = {'FLIGHT', 'OCEAN', 'BOTANICA', 'CELESTIAL', 'ABSTRACT MOTION'}
          assert set(by_id) == expected
          assert by_id['FLIGHT']['status'] == 'active'
          assert by_id['FLIGHT']['productCount'] == 1
          assert by_id['FLIGHT']['products'] == ['vx4800']
          for collection_id in expected - {'FLIGHT'}:
              assert by_id[collection_id]['status'] == 'planned'
              assert by_id[collection_id]['productCount'] == 0
              assert by_id[collection_id]['products'] == []
          PY
