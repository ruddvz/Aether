name: Build VX4800 Blender master

on:
  push:
    branches:
      - "feat/vx4800-blender-*"
    paths:
      - "blender/vx4800/aether_blender_lib.py"
      - "blender/vx4800/lookdev_modes.py"
      - "blender/vx4800/build_entrypoint.py"
      - "blender/vx4800/build_scene.py"
      - "blender/vx4800/validate_scene.py"
      - "blender/vx4800/render_shot.py"
      - "blender/vx4800/scene_manifest.json"
      - "blender/vx4800/render_presets.json"
      - ".github/workflows/blender.yml"
      - "fixtures/vx4800/fixture.json"
      - "fixtures/vx4800/composition/engineering-v1.3.0.csv"
      - "fixtures/vx4800/photometry/led-setout-engineering-v1.3.0.csv"
      - "fixtures/vx4800/photometry/concept-v5.2.0.json"
      - "fixtures/vx4800/geometry/parameters-v1.3.0.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-blend:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Cache Blender distribution
        id: blender-cache
        uses: actions/cache@v4
        with:
          path: .blender-cache
          key: blender-5.2.1-linux-x64

      - name: Download and verify Blender 5.2.1 LTS
        if: steps.blender-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .blender-cache
          cd .blender-cache
          curl -fsSLO https://download.blender.org/release/Blender5.2/blender-5.2.1-linux-x64.tar.xz
          curl -fsSLO https://download.blender.org/release/Blender5.2/blender-5.2.1.sha256
          grep 'blender-5.2.1-linux-x64.tar.xz' blender-5.2.1.sha256 | sha256sum -c -
          tar -xf blender-5.2.1-linux-x64.tar.xz
          rm blender-5.2.1-linux-x64.tar.xz blender-5.2.1.sha256

      - name: Build Blender master
        shell: bash
        run: |
          set -euo pipefail
          BLENDER="$GITHUB_WORKSPACE/.blender-cache/blender-5.2.1-linux-x64/blender"
          "$BLENDER" --background --factory-startup \
            --python blender/vx4800/build_entrypoint.py -- \
            --repo-root "$GITHUB_WORKSPACE" \
            --output blender/vx4800/VX4800_MASTER.blend
          test -s blender/vx4800/VX4800_MASTER.blend

      - name: Validate generated Blender scene
        shell: bash
        run: |
          set -euo pipefail
          BLENDER="$GITHUB_WORKSPACE/.blender-cache/blender-5.2.1-linux-x64/blender"
          "$BLENDER" --background blender/vx4800/VX4800_MASTER.blend \
            --python blender/vx4800/validate_scene.py -- \
            --report build/blender/validation.json
          test -s build/blender/validation.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('build/blender/validation.json').read_text())
          if report.get('status') != 'pass':
              raise SystemExit(f"Blender validation did not pass: {report}")
          PY

      - name: Refresh generated Blender master on feature branch
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blender/vx4800/VX4800_MASTER.blend
          if git diff --cached --quiet; then
            echo "Blender master is unchanged"
          else
            git commit -m "chore(blender): refresh VX4800 master [skip ci]"
            git push
          fi

      - name: Render quick Cycles hero preview
        shell: bash
        run: |
          set -euo pipefail
          BLENDER="$GITHUB_WORKSPACE/.blender-cache/blender-5.2.1-linux-x64/blender"
          "$BLENDER" --background blender/vx4800/VX4800_MASTER.blend \
            --python blender/vx4800/render_shot.py -- \
            --repo-root "$GITHUB_WORKSPACE" \
            --camera CAM_HERO_FRONT_3Q \
            --preset preview \
            --output build/blender/VX4800_HERO_PREVIEW.png
          test -s build/blender/VX4800_HERO_PREVIEW.png

      - name: Render quick Cycles butterfly macro preview
        shell: bash
        run: |
          set -euo pipefail
          BLENDER="$GITHUB_WORKSPACE/.blender-cache/blender-5.2.1-linux-x64/blender"
          "$BLENDER" --background blender/vx4800/VX4800_MASTER.blend \
            --python blender/vx4800/render_shot.py -- \
            --repo-root "$GITHUB_WORKSPACE" \
            --camera CAM_BUTTERFLY_MACRO \
            --preset preview \
            --output build/blender/VX4800_BUTTERFLY_MACRO_PREVIEW.png
          test -s build/blender/VX4800_BUTTERFLY_MACRO_PREVIEW.png

      - name: Upload Blender validation outputs
        uses: actions/upload-artifact@v4
        with:
          name: vx4800-blender-validation
          path: |
            build/blender/VX4800_HERO_PREVIEW.png
            build/blender/VX4800_BUTTERFLY_MACRO_PREVIEW.png
            build/blender/validation.json
          if-no-files-found: error
